name: Boutique CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

#GITHUB_TOKEN is automatically provided by GitHub Actions, but the 
#workflow needs explicit permission to write packages to GHCR.
permissions:
  contents: write
  packages: write

jobs:
  application-build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: projects/boutique-microservices
        run: npm ci

      - name: Build application
        working-directory: projects/boutique-microservices
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: application-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: projects/boutique-microservices/backend/services/auth

          - service: gateway
            context: projects/boutique-microservices/backend/services/gateway

          - service: product-service
            context: projects/boutique-microservices/backend/services/product-service

          - service: orders
            context: projects/boutique-microservices/backend/services/orders

          - service: order-service
            context: projects/boutique-microservices/backend/services/order-service

          - service: user-service
            context: projects/boutique-microservices/backend/services/user-service

          - service: frontend
            context: projects/boutique-microservices/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

          docker build \
            -t $IMAGE \
            ${{ matrix.context }}

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE
          fi

  gitops-update:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update GHCR image tags
        run: |
          SHA="${{ github.sha }}"

          sed -i "s#newTag: .*#newTag: ${SHA}#g" \
            gitops-local/overlays/ghcr/kustomization.yml

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops-local/overlays/ghcr/kustomization.yml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "chore: update image tags to ${GITHUB_SHA}"
          git push

  kubernetes-validation:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Prepare local secret template
        run: cp gitops-local/secrets.example.yml gitops-local/overlays/local/secrets.yml

      - name: Validate local manifests
        run: kubectl kustomize gitops-local/overlays/local/
        