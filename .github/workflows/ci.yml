name: Boutique CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  application-build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: projects/boutique-microservices
        run: npm ci

      - name: Build application
        working-directory: projects/boutique-microservices
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: application-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: projects/boutique-microservices/backend/services/auth

          - service: gateway
            context: projects/boutique-microservices/backend/services/gateway

          - service: product-service
            context: projects/boutique-microservices/backend/services/product-service

          - service: orders
            context: projects/boutique-microservices/backend/services/orders

          - service: order-service
            context: projects/boutique-microservices/backend/services/order-service

          - service: user-service
            context: projects/boutique-microservices/backend/services/user-service

          - service: frontend
            context: projects/boutique-microservices/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t boutique/${{ matrix.service }}:ci \
            ${{ matrix.context }}

  kubernetes-validation:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Prepare local secret template
        run: cp gitops-local/secrets.example.yml gitops-local/secrets.yml

      - name: Validate local manifests
        run: kubectl kustomize gitops-local/
        